<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Construire un rituel — maquette</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#F7F1EA;--surface:#FFFDFA;--surface-warm:#FBF5ED;--ink:#2E211C;--ink-soft:#5E4D43;--muted:#968779;--line:#E7DCCB;--accent:#C95A3F;--accent-soft:#EBCDC0;--accent-deep:#8E3C26;--blush:#E8A6A0;--blush-soft:#F6E0DC;--sage:#7A9468;--gold:#BD9A52;--serif:'Newsreader',Georgia,serif;--sans:'Manrope',sans-serif;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:var(--sans);background:#E8DFD2;display:flex;justify-content:center;padding:20px;min-height:100vh;-webkit-font-smoothing:antialiased;}
  #app{position:relative;width:100%;max-width:400px;height:min(860px,92vh);background:var(--bg);border-radius:28px;overflow:hidden;box-shadow:0 30px 70px rgba(46,33,28,0.28);}
  .scroll{height:100%;overflow-y:auto;scrollbar-width:none;position:relative;}
  .scroll::-webkit-scrollbar{display:none;}

  /* Bandeau lever de soleil */
  .banner{position:relative;height:172px;overflow:hidden;}
  .banner svg{position:absolute;inset:0;width:100%;height:100%;}
  .banner-txt{position:absolute;left:0;right:0;bottom:16px;text-align:center;z-index:2;}
  .banner-k{font-size:10.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#9A5B3C;}
  .banner-t{font-family:var(--serif);font-size:27px;font-weight:600;color:#3A2418;margin-top:3px;text-shadow:0 1px 10px rgba(255,240,220,0.7);}
  .banner-edit{font-size:11px;color:#9A5B3C;margin-top:2px;opacity:.8;}
  .back{position:absolute;top:14px;left:14px;z-index:3;width:38px;height:38px;border-radius:50%;background:rgba(255,253,250,0.8);backdrop-filter:blur(6px);border:none;font-size:19px;color:#3A2418;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(46,33,28,0.14);}
  .tools{position:absolute;top:14px;right:14px;z-index:3;display:flex;gap:7px;}
  .tool{width:38px;height:38px;border-radius:50%;background:rgba(255,253,250,0.8);backdrop-filter:blur(6px);border:none;font-size:16px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(46,33,28,0.14);cursor:pointer;}

  /* Carte / chemin */
  .map{position:relative;width:360px;margin:0 auto;}
  .map .bg{position:absolute;top:0;left:0;z-index:0;}
  .node{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;z-index:3;width:104px;cursor:pointer;}
  .ring{width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:25px;position:relative;transition:transform .16s ease;}
  .node:active .ring{transform:scale(0.92);}
  .ring.empty{background:rgba(255,253,250,0.72);border:2.5px dashed var(--accent-soft);color:var(--accent);backdrop-filter:blur(3px);}
  .ring.filled{background:var(--surface);border:2.5px solid var(--accent);box-shadow:0 0 0 6px rgba(201,90,63,0.10),0 8px 18px rgba(201,90,63,0.22);}
  .ring .add{font-size:26px;font-weight:300;color:var(--accent);}
  .lbl{margin-top:7px;font-family:var(--serif);font-size:12.5px;font-weight:600;color:#3A2418;text-align:center;line-height:1.15;background:rgba(255,253,250,0.66);padding:2px 9px;border-radius:99px;backdrop-filter:blur(3px);}
  .sub{font-size:10px;color:var(--muted);margin-top:2px;background:rgba(255,253,250,0.5);padding:1px 7px;border-radius:99px;}
  .start{width:44px;height:44px;border-radius:50%;background:var(--sage);display:flex;align-items:center;justify-content:center;font-size:17px;box-shadow:0 6px 16px rgba(122,148,104,0.4);}
  .goal{width:70px;height:70px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#F4D98A,var(--gold) 60%,var(--accent));display:flex;align-items:center;justify-content:center;font-size:32px;box-shadow:0 0 0 8px rgba(189,154,82,0.16),0 14px 30px rgba(189,154,82,0.45);}

  /* Bouton valider stylé */
  .validate-wrap{padding:6px 26px 30px;position:relative;z-index:3;}
  .validate{width:100%;border:none;border-radius:18px;padding:17px;font-family:var(--sans);font-size:15.5px;font-weight:700;color:#fff;cursor:pointer;
    background:linear-gradient(135deg,#E0A756,var(--accent) 55%,#A83E27);box-shadow:0 10px 26px rgba(201,90,63,0.4),inset 0 1px 0 rgba(255,255,255,0.25);
    display:flex;align-items:center;justify-content:center;gap:9px;letter-spacing:.01em;transition:transform .15s ease,box-shadow .15s ease;position:relative;overflow:hidden;}
  .validate:active{transform:translateY(1px) scale(0.99);}
  .validate .shine{position:absolute;top:0;left:-60%;width:50%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,0.35),transparent);animation:shine 3.2s ease-in-out infinite;}
  @keyframes shine{0%{left:-60%;}55%,100%{left:130%;}}
  .validate-hint{text-align:center;font-size:11.5px;color:var(--muted);margin-top:10px;}

  /* Popup carrousel produit */
  .pop{position:absolute;z-index:20;width:270px;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 20px 44px rgba(46,33,28,0.28);padding:12px 12px 14px;opacity:0;transform:scale(0.9);transform-origin:top center;transition:opacity .16s ease,transform .16s ease;pointer-events:none;}
  .pop.show{opacity:1;transform:scale(1);pointer-events:auto;}
  .pop-arrow{position:absolute;top:-7px;left:50%;transform:translateX(-50%) rotate(45deg);width:14px;height:14px;background:var(--surface);border-left:1px solid var(--line);border-top:1px solid var(--line);}
  .pop-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;padding:0 2px;}
  .pop-t{font-size:12px;font-weight:700;color:var(--ink);}
  .pop-x{background:none;border:none;font-size:17px;color:var(--muted);cursor:pointer;line-height:1;}
  .car{display:flex;gap:9px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;scroll-snap-type:x mandatory;}
  .car::-webkit-scrollbar{display:none;}
  .pcard{min-width:96px;scroll-snap-align:start;background:var(--surface-warm);border:1px solid var(--line);border-radius:13px;padding:11px 9px;text-align:center;cursor:pointer;transition:transform .12s ease,border-color .12s ease;}
  .pcard:active{transform:scale(0.95);}
  .pcard.sel{border-color:var(--accent);background:var(--blush-soft);}
  .pcard-e{font-size:26px;}
  .pcard-n{font-size:11px;font-weight:600;color:var(--ink);margin-top:6px;line-height:1.2;}
  .pcard-b{font-size:9.5px;color:var(--muted);margin-top:1px;}
  .pop-none{font-size:11.5px;color:var(--muted);text-align:center;padding:6px 4px;}
  .pop-skip{margin-top:10px;width:100%;background:none;border:1px dashed var(--line);border-radius:11px;padding:8px;font-size:11.5px;font-weight:600;color:var(--muted);cursor:pointer;}

  /* Waouh */
  .wow{position:absolute;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:rgba(46,33,28,0.28);backdrop-filter:blur(3px);}
  .wow.show{display:flex;}
  .wow-card{background:var(--surface);border-radius:26px;padding:30px 26px;text-align:center;max-width:290px;box-shadow:0 30px 70px rgba(46,33,28,0.35);transform:scale(0.7);opacity:0;transition:transform .4s cubic-bezier(.2,1.3,.4,1),opacity .3s;}
  .wow.show .wow-card{transform:scale(1);opacity:1;}
  .wow-badge{width:84px;height:84px;border-radius:50%;margin:0 auto;background:radial-gradient(circle at 40% 35%,#F4D98A,var(--gold) 60%,var(--accent));display:flex;align-items:center;justify-content:center;font-size:42px;box-shadow:0 0 0 10px rgba(189,154,82,0.15);animation:pop 0.5s ease;}
  @keyframes pop{0%{transform:scale(0);}70%{transform:scale(1.15);}100%{transform:scale(1);}}
  .wow-t{font-family:var(--serif);font-size:23px;font-weight:600;color:var(--ink);margin-top:16px;}
  .wow-s{font-size:13px;color:var(--ink-soft);margin-top:8px;line-height:1.5;}
  .wow-btn{margin-top:20px;background:var(--accent);color:#fff;border:none;border-radius:13px;padding:12px 24px;font-family:var(--sans);font-size:14px;font-weight:600;cursor:pointer;}
  .spark{position:absolute;font-size:18px;pointer-events:none;z-index:41;animation:fly 1.1s ease-out forwards;}
  @keyframes fly{0%{opacity:0;transform:translate(0,0) scale(0.4);}20%{opacity:1;}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.1);}}
</style></head><body><div id="app">
  <div class="scroll">
    <div class="banner">
      <svg viewBox="0 0 360 172" preserveAspectRatio="xMidYMid slice">
        <defs>
          <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FCE7C4"/><stop offset="0.5" stop-color="#F9CFA6"/><stop offset="1" stop-color="#F3B79A"/></linearGradient>
          <radialGradient id="sun" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#FFF3D0"/><stop offset="0.5" stop-color="#FFD97F"/><stop offset="1" stop-color="#FFC96A" stop-opacity="0"/></radialGradient>
        </defs>
        <rect width="360" height="172" fill="url(#sky)"/>
        <circle cx="180" cy="150" r="95" fill="url(#sun)" opacity="0.9"/>
        <circle cx="180" cy="150" r="42" fill="#FFE39A"/>
        <path d="M0 150 Q70 118 140 138 T280 132 T360 142 V172 H0 Z" fill="#EEB791" opacity="0.85"/>
        <path d="M0 158 Q90 134 170 152 T360 150 V172 H0 Z" fill="#E3A588"/>
      </svg>
      <button class="back">‹</button>
      <div class="tools"><button class="tool" title="Modifier">🔨</button><button class="tool" title="Supprimer" onclick="alert('Supprimer le rituel (démo)')">🗑️</button></div>
      <div class="banner-txt"><div class="banner-k">Ton rituel · Matin</div><div class="banner-t">Rituel du matin</div><div class="banner-edit">✎ touche pour renommer</div></div>
    </div>

    <div class="map" id="map"></div>

    <div class="validate-wrap">
      <button class="validate" onclick="finish()"><span class="shine"></span>✨ J'ai fini mon rituel</button>
      <div class="validate-hint">Tu peux valider même si toutes les étapes ne sont pas remplies 🌸</div>
    </div>
  </div>

  <div class="pop" id="pop"><div class="pop-arrow"></div><div class="pop-h"><div class="pop-t" id="pop-t">Choisis un produit</div><button class="pop-x" onclick="closePop()">×</button></div><div class="car" id="car"></div><button class="pop-skip" onclick="closePop()">Laisser cette étape vide</button></div>

  <div class="wow" id="wow"><div class="wow-card"><div class="wow-badge">🌿</div><div class="wow-t">Ton rituel est prêt !</div><div class="wow-s">Ton chemin du matin est tracé. Il t'attend chaque jour dans "Aujourd'hui" 🌸</div><button class="wow-btn" onclick="document.getElementById('wow').classList.remove('show')">Voir mon rituel</button></div></div>
</div>
<script>
  // Étapes canoniques (matin)
  const PHASES=[
    {key:'preparer',emoji:'🌸',nom:'Préparer',cat:'demaquillant'},
    {key:'nettoyer',emoji:'🫧',nom:'Nettoyer',cat:'nettoyant'},
    {key:'equilibrer',emoji:'💦',nom:'Équilibrer',cat:'toner'},
    {key:'traiter',emoji:'🎯',nom:'Traiter',cat:'serum'},
    {key:'hydrater',emoji:'💧',nom:'Hydrater',cat:'creme'},
    {key:'proteger',emoji:'☀️',nom:'Protéger',cat:'spf'}
  ];
  const CATALOG={
    demaquillant:[['🧴','Baume démaquillant','Clinique'],['💧','Huile nettoyante','Nuxe']],
    nettoyant:[['🫧','Gel nettoyant doux','CeraVe'],['☁️','Mousse tolérance','Avène'],['🧴','Gelée purifiante','La Roche']],
    toner:[['💦','Lotion tonique','Klairs'],['🌿','Eau apaisante','Avène']],
    serum:[['✨','Sérum vitamine C','The Ordinary'],['🩹','Niacinamide','The Ordinary'],['💠','Acide hyaluronique','La Roche']],
    creme:[['🧴','Crème hydratante','Avène'],['💧','Gel-crème','Neutrogena'],['🌸','Cica baume','La Roche']],
    spf:[['☀️','Fluide SPF 50','La Roche'],['🌤️','SPF 50 fluide','Avène'],['🫧','SPF invisible','Bioderma']]
  };
  const filled={ nettoyer:['🫧','Gel nettoyant doux','CeraVe'] }; // une étape déjà remplie pour l'exemple
  let activePhase=null;

  const cx=180,left=104,right=256,top=196,gap=118;
  function positions(){ const pts=[{x:cx,y:top}]; PHASES.forEach((_,i)=>pts.push({x:(i%2===0)?left:right,y:top+(i+1)*gap})); pts.push({x:cx,y:top+(PHASES.length+1)*gap}); return pts; }

  function renderMap(){
    const map=document.getElementById('map');
    const pts=positions();
    const H=top+(PHASES.length+1)*gap+70;
    map.style.height=H+'px';
    // décor : montagnes + lac (SVG)
    let d='M '+pts[0].x+' '+pts[0].y+' L '+((pts[0].x+pts[1].x)/2)+' '+((pts[0].y+pts[1].y)/2);
    for(let i=1;i<pts.length-1;i++){const xc=(pts[i].x+pts[i+1].x)/2,yc=(pts[i].y+pts[i+1].y)/2;d+=' Q '+pts[i].x+' '+pts[i].y+' '+xc+' '+yc;}
    d+=' L '+pts[pts.length-1].x+' '+pts[pts.length-1].y;
    const lakeY=pts[pts.length-1].y;
    const bg='<svg class="bg" width="360" height="'+H+'" viewBox="0 0 360 '+H+'">'+
      '<defs><linearGradient id="mapsky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F6E7D2"/><stop offset="0.28" stop-color="#F7F1EA"/><stop offset="1" stop-color="#F7F1EA"/></linearGradient>'+
      '<linearGradient id="lake" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D6E1E1"/><stop offset="1" stop-color="#C4D4D4"/></linearGradient></defs>'+
      '<rect width="360" height="'+H+'" fill="url(#mapsky)"/>'+
      // montagnes lointaines
      '<path d="M-20 '+(top+120)+' L90 '+(top+30)+' L170 '+(top+110)+' L250 '+(top+20)+' L380 '+(top+120)+' V'+H+' H-20 Z" fill="#E6DBC7" opacity="0.55"/>'+
      '<path d="M-20 '+(top+230)+' L120 '+(top+120)+' L230 '+(top+210)+' L360 '+(top+120)+' L380 '+(top+200)+' V'+H+' H-20 Z" fill="#DBCEB4" opacity="0.5"/>'+
      // collines proches
      '<path d="M-20 '+(top+430)+' Q120 '+(top+360)+' 200 '+(top+420)+' T400 '+(top+410)+' V'+H+' H-20 Z" fill="#E7DFC9" opacity="0.7"/>'+
      // lac
      '<ellipse cx="180" cy="'+(lakeY+14)+'" rx="150" ry="46" fill="url(#lake)" opacity="0.85"/>'+
      '<ellipse cx="150" cy="'+(lakeY+6)+'" rx="70" ry="10" fill="#EAF1F1" opacity="0.5"/>'+
      // arbres déco
      '<g opacity="0.6"><circle cx="40" cy="'+(top+300)+'" r="13" fill="#A9BE97"/><rect x="37" y="'+(top+305)+'" width="6" height="14" fill="#B79A73"/></g>'+
      '<g opacity="0.6"><circle cx="322" cy="'+(top+540)+'" r="15" fill="#9DB58A"/><rect x="319" y="'+(top+548)+'" width="6" height="16" fill="#B79A73"/></g>'+
      // chemin
      '<path d="'+d+'" fill="none" stroke="#D8C09B" stroke-width="9" stroke-linecap="round" opacity="0.9"/>'+
      '<path d="'+d+'" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-dasharray="1 17" opacity="0.7"/>'+
      '</svg>';

    let nodes='<div class="node" style="left:'+pts[0].x+'px;top:'+pts[0].y+'px;"><div class="start">🌱</div><div class="lbl">Départ</div></div>';
    PHASES.forEach(function(ph,i){ const pt=pts[i+1]; const f=filled[ph.key];
      if(f){ nodes+='<div class="node" style="left:'+pt.x+'px;top:'+pt.y+'px;" onclick="openPop(\''+ph.key+'\','+pt.x+','+pt.y+')"><div class="ring filled">'+f[0]+'</div><div class="lbl">'+ph.nom+'</div><div class="sub">'+f[1]+'</div></div>'; }
      else { nodes+='<div class="node" style="left:'+pt.x+'px;top:'+pt.y+'px;" onclick="openPop(\''+ph.key+'\','+pt.x+','+pt.y+')"><div class="ring empty"><span class="add">+</span></div><div class="lbl">'+ph.nom+'</div><div class="sub">facultatif</div></div>'; }
    });
    const g=pts[pts.length-1];
    nodes+='<div class="node" style="left:'+g.x+'px;top:'+g.y+'px;"><div class="goal">✨</div><div class="lbl">Objectif</div></div>';
    map.innerHTML=bg+nodes;
  }

  function openPop(key,x,y){
    activePhase=key;
    const ph=PHASES.find(p=>p.key===key);
    const list=CATALOG[ph.cat]||[];
    document.getElementById('pop-t').textContent=ph.emoji+'  '+ph.nom;
    const car=document.getElementById('car');
    if(list.length){ car.innerHTML=list.map((p,i)=>'<div class="pcard'+(filled[key]&&filled[key][1]===p[1]?' sel':'')+'" onclick="pick(\''+key+'\','+i+')"><div class="pcard-e">'+p[0]+'</div><div class="pcard-n">'+p[1]+'</div><div class="pcard-b">'+p[2]+'</div></div>').join(''); }
    else { car.innerHTML='<div class="pop-none">Aucun produit de cette catégorie.<br>Ajoute-en un dans ta collection d\'abord.</div>'; }
    // positionner sous le rond
    const app=document.getElementById('app').getBoundingClientRect();
    const scroll=document.querySelector('.scroll');
    const pop=document.getElementById('pop');
    pop.style.width='270px';
    let px=x-135; px=Math.max(12,Math.min(px, 360-270-12));
    const py=(y+40)-scroll.scrollTop;
    pop.style.left=px+'px';
    pop.style.top=py+'px';
    pop.querySelector('.pop-arrow').style.left=(x-px)+'px';
    pop.classList.add('show');
  }
  function pick(key,i){ filled[key]=CATALOG[PHASES.find(p=>p.key===key).cat][i]; closePop(); renderMap(); }
  function closePop(){ document.getElementById('pop').classList.remove('show'); }

  function finish(){
    // étincelles
    const app=document.getElementById('app');
    const cxp=200, cyp=560;
    for(let i=0;i<18;i++){ const s=document.createElement('div'); s.className='spark'; s.textContent=['✦','✧','🌟','⭐','💫'][i%5];
      s.style.left=cxp+'px'; s.style.top=cyp+'px'; const ang=Math.random()*Math.PI*2, dist=80+Math.random()*160;
      s.style.setProperty('--dx',(Math.cos(ang)*dist)+'px'); s.style.setProperty('--dy',(Math.sin(ang)*dist-40)+'px');
      app.appendChild(s); setTimeout(()=>s.remove(),1200); }
    setTimeout(()=>document.getElementById('wow').classList.add('show'),260);
  }

  renderMap();
</script></body></html>
